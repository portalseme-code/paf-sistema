<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema PAF - Programa de Autonomia Financeira</title>
  <link rel="icon" href="data:,">

  <!-- Tailwind CSS (compila as classes utilitárias direto no navegador) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- PropTypes (usado internamente pelo Recharts) -->
  <script src="https://unpkg.com/prop-types/prop-types.js" crossorigin></script>

  <!-- Recharts (gráficos) -->
  <script src="https://unpkg.com/recharts/umd/Recharts.js" crossorigin></script>

  <!-- Babel Standalone: transforma o JSX direto no navegador (sem etapa de build) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #carregando-inicial {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #64748b; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="carregando-inicial">Carregando Sistema PAF...</div>
  </div>

  <!-- Nosso código do sistema (React + JSX), transformado em tempo real pelo Babel -->
  <script type="text/babel" data-presets="react" src="./app.js"></script>
</body>
</html>
