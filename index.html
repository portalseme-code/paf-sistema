<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema PAF - Programa de Autonomia Financeira</title>
  <link rel="icon" href="data:,">

  <!-- Tailwind CSS (compila as classes utilitarias direto no navegador) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- PropTypes (usado internamente pelo Recharts) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.js" crossorigin></script>

  <!-- Recharts (graficos) - versao travada, pois a "latest" mudou de formato e quebra o carregamento -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>

  <!-- Babel Standalone: transforma o JSX direto no navegador (sem etapa de build) - versao travada -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>

  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #carregando-inicial {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #64748b; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="carregando-inicial">Carregando Sistema PAF...</div>
  </div>

  <!-- Nosso codigo do sistema (React + JSX), transformado em tempo real pelo Babel -->
  <!-- O "?v=" no final força o navegador/GitHub Pages a buscar a versão mais -->
  <!-- nova sempre que o número mudar, em vez de usar uma cópia guardada em cache. -->
  <script type="text/babel" data-presets="react" src="./app.js?v=12"></script>
</body>
</html>
